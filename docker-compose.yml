services:
  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      COOKIE_SECURE: "true"
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
